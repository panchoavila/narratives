<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nova Warp · Revyme</title>
    <style>
      * { box-sizing: border-box; }
      html { background: #070e28; }
      body { margin: 0; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif; color: #fff; }
      button, a { font: inherit; }
      button { cursor: pointer; }
      a { color: inherit; }
      .hero { min-height: 760px; height: 100svh; position: relative; isolation: isolate; overflow: hidden; }
      .top { position: absolute; inset: 0 0 auto; padding: 30px 5%; display: flex; align-items: center; justify-content: space-between; z-index: 2; }
      .brand { font-size: 14px; font-weight: 600; letter-spacing: .18em; }
      .pause { color: #d0d5e8; border: 1px solid #ffffff40; background: transparent; border-radius: 40px; padding: 10px 18px; }
      .copy { position: relative; min-height: inherit; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 120px 24px 60px; text-align: center; }
      .eyebrow { font-size: 12px; letter-spacing: .25em; color: #a0b9ff; text-transform: uppercase; }
      h1 { font-size: clamp(44px, 7.8vw, 112px); font-weight: 600; letter-spacing: -.065em; line-height: 1; margin: 26px 0; }
      .sub { color: #b8bfd7; font-size: 18px; line-height: 1.6; max-width: 480px; margin: 0 0 42px; }
      .launch { display: inline-block; padding: 19px 35px; border-radius: 40px; text-decoration: none; background: #3187ff; font-size: 18px; font-weight: 600; }
      .launch:focus-visible, button:focus-visible { outline: 3px solid white; outline-offset: 5px; }
      .hint { color: #b8bfd7; font-size: 12px; margin-top: 20px; }
      .foot { position: absolute; bottom: 25px; left: 5%; right: 5%; display: flex; justify-content: space-between; color: #8794bb; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
      .beyond { min-height: 100svh; padding: 120px 8%; background: #eae8df; color: #1d2440; }
      .beyond h2 { max-width: 900px; font-size: clamp(40px, 6vw, 80px); letter-spacing: -.05em; font-weight: 500; }
      .beyond p { font-size: 20px; max-width: 580px; line-height: 1.6; }
      @media (max-width: 600px) { .hero { min-height: 680px; } .top { padding-top: 22px; } .sub { font-size: 16px; } .foot { font-size: 9px; } }
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="./main.tsx"></script></body>
</html>
